; PlatformIO — CardioIA Fase 3 (ESP32)
;
; Compila o sketch local em fase3/firmware/cardioia_fase3/cardioia_fase3.ino
; e gera os artefatos em fase3/firmware/.pio/build/esp32dev/
; (firmware.elf e firmware.bin), consumidos pelo simulador Wokwi.

[platformio]
src_dir = cardioia_fase3

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DMQTT_MAX_PACKET_SIZE=512
lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^6.21.5
